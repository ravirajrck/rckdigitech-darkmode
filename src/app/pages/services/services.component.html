<div
  class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 space-y-16 relative overflow-hidden"
>
  <div class="max-w-7xl mx-auto space-y-16 w-full">
    <!-- Header Title -->
    <div class="text-center space-y-3" data-aos="fade-down">
      <h2 class="text-3xl sm:text-5xl font-black tracking-tight text-white">
        Explore Our
        <span
          class="text-transparent bg-clip-text bg-gradient-to-r from-[#FFD758] to-amber-500"
          >Services</span
        >
      </h2>
      <p
        class="text-neutral-400 text-sm sm:text-base max-w-2xl mx-auto font-light"
      >
        Discover comprehensive digital solutions tailored to elevate your
        business, enhance user experience, and drive seamless growth.
      </p>
    </div>

    <!-- Interactive Grid Cards Selection -->
    <div
      class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4"
      data-aos="fade-up"
    >
      <a
        *ngFor="let service of services"
        [routerLink]="[service.route]"
        routerLinkActive="bg-neutral-900 border-[#FFD758] text-white shadow-[0_0_20px_rgba(255,215,88,0.15)] ring-1 ring-[#FFD758]"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex flex-col items-center text-center p-5 rounded-2xl bg-neutral-900/50 border border-neutral-800 text-neutral-400 hover:border-neutral-700 hover:text-neutral-200 transition-all duration-300 group cursor-pointer"
      >
        <div
          class="p-3.5 rounded-xl bg-neutral-950 border border-neutral-800 mb-3 group-hover:scale-110 transition-transform"
        >
          <!-- Dynamic SVG Icon -->
          <svg
            class="h-6 w-6 stroke-current text-[#FFD758] transition-colors"
            fill="none"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            viewBox="0 0 24 24"
          >
            <path [attr.d]="service.svgIcon"></path>
          </svg>
        </div>
        <span
          class="text-xs sm:text-sm font-semibold tracking-tight line-clamp-2"
          >{{ service.title }}</span
        >
      </a>
    </div>

    <!-- Content Area (Sub-pages render here) -->
    <main class="w-full pt-4" data-aos="fade-up" data-aos-delay="100">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
<app-shared-contact></app-shared-contact>
