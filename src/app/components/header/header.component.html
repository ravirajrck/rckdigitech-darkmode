<!-- Top Contact Bar (Futuristic Dark Style) -->
<div class="w-full text-xs md:text-sm px-4 py-2 bg-neutral-950 border-b border-neutral-800 text-neutral-300 relative z-40">
  <div class="max-w-7xl mx-auto flex flex-wrap justify-center md:justify-end items-center gap-6">
    <!-- Email -->
    <a [href]="'mailto:' + sideData.email" class="flex items-center gap-2 hover:text-[#FFD758] transition cursor-pointer">
      <svg class="w-4 h-4 text-[#FFD758]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
      </svg>
      {{sideData.email}}
    </a>
    <!-- Skype / Chat -->
    <a [href]="'skype:' + sideData.skype + '?chat'" class="flex items-center gap-2 hover:text-[#FFD758] transition cursor-pointer">
      <svg class="w-4 h-4 text-[#FFD758]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
      </svg>
      {{sideData.skype}}
    </a>
    <!-- WhatsApp / Phone -->
    <a [href]="'tel:' + sideData.phone" target="_blank" class="flex items-center gap-2 hover:text-[#FFD758] transition cursor-pointer">
      <svg class="w-4 h-4 text-[#FFD758]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
      </svg>
      +{{sideData.phone}}
    </a>
  </div>
</div>

<!-- ✅ Futuristic Galaxy Starfield & Wave Navbar -->
<nav id="navbar" class="sticky top-0 w-full z-40 px-6 md:px-16 py-3 bg-neutral-950/80 backdrop-blur-md border-b border-neutral-800/80 text-white transition-all duration-300 overflow-hidden">
  <!-- 🌌 Galaxy Canvas Background -->
  <canvas #galaxyCanvas id="galaxyNavbarCanvas" class="absolute inset-0 w-full h-full pointer-events-none -z-10"></canvas>

  <div class="max-w-7xl mx-auto flex items-center justify-between relative z-10">
    <!-- 🔷 Logo + Name -->
    <div class="flex items-center space-x-3.5 group">
      <a routerLink="/home" class="cursor-pointer relative flex-shrink-0">
        <div class="absolute -inset-1 bg-gradient-to-r from-[#FFD758]/40 to-amber-600/40 rounded-full blur-sm opacity-0 group-hover:opacity-100 transition duration-500"></div>
        <div class="relative w-11 h-11 md:w-14 md:h-14 overflow-hidden flex items-center justify-center shadow-lg">
          <img src="assets/Images/logo/rckdigitechlogo3.webp" alt="RCK DIGITECH Logo" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-500" />
        </div>
      </a>

      <!-- Brand Name & Tagline -->
      <div class="leading-tight flex flex-col justify-center">
        <a routerLink="/home" class="cursor-pointer text-lg sm:text-xl md:text-2xl font-extrabold tracking-wider text-white hover:text-[#FFD758] transition-colors duration-300">
          RCK <span class="text-[#FFD758]">DIGITECH</span>
        </a>
        <span class="text-[10px] sm:text-xs tracking-[0.2em] text-neutral-400 font-light block uppercase mt-0.5">
          WE BUILD TECH FOR TOMORROW
        </span>
      </div>
    </div>

    <!-- 🔘 Mobile Menu Button -->
    <button (click)="toggleMenu()" id="menu-toggle" class="md:hidden text-[#FFD758] focus:outline-none focus:ring-2 focus:ring-[#FFD758] p-1 rounded cursor-pointer">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
<!-- 📋 Menu List with Magic Flow Effect -->
<ul [class.hidden]="isMenuHidden" class="md:flex flex-col md:flex-row md:items-center space-y-4 md:space-y-0 md:space-x-1 text-base font-medium absolute md:static top-full left-0 w-full md:w-auto bg-neutral-950 md:bg-transparent p-6 md:p-0 border-b border-neutral-800 md:border-none shadow-2xl md:shadow-none relative">
  
  <!-- Home -->
  <li class="relative">
    <a 
      routerLink="/home" 
      [routerLinkActiveOptions]="{ exact: true }"
      routerLinkActive="active-tab" 
      class="nav-link px-4 py-2 rounded-full block text-neutral-300 hover:text-[#FFD758] transition relative z-10 cursor-pointer whitespace-nowrap">
      Home
    </a>
  </li>

  <!-- Services -->
  <li class="relative">
    <a 
      routerLink="/services" 
      [routerLinkActiveOptions]="{ exact: false }"
      routerLinkActive="active-tab" 
      class="nav-link px-4 py-2 rounded-full block text-neutral-300 hover:text-[#FFD758] transition relative z-10 cursor-pointer whitespace-nowrap">
      Services
    </a>
  </li>

  <!-- Portfolio -->
  <li class="relative">
    <a 
      routerLink="/portfolio" 
      [routerLinkActiveOptions]="{ exact: true }"
      routerLinkActive="active-tab" 
      class="nav-link px-4 py-2 rounded-full block text-neutral-300 hover:text-[#FFD758] transition relative z-10 cursor-pointer whitespace-nowrap">
      Portfolio
    </a>
  </li>

  <!-- About -->
  <li class="relative">
    <a 
      routerLink="/about" 
      [routerLinkActiveOptions]="{ exact: true }"
      routerLinkActive="active-tab" 
      class="nav-link px-4 py-2 rounded-full block text-neutral-300 hover:text-[#FFD758] transition relative z-10 cursor-pointer whitespace-nowrap">
      About
    </a>
  </li>

  <!-- Contact -->
  <li class="relative">
    <a 
      routerLink="/contact" 
      [routerLinkActiveOptions]="{ exact: true }"
      routerLinkActive="active-tab-contact" 
      class="nav-link px-5 py-2 rounded-full border border-[#FFD758] text-[#FFD758] hover:bg-[#FFD758] hover:text-neutral-950 transition shadow-[0_0_10px_rgba(255,215,88,0.2)] block relative z-10 cursor-pointer whitespace-nowrap">
      Contact
    </a>
  </li>

</ul>
  </div>
</nav>
