  <!-- 🔷 Contact Form & Intro Section -->
  <section
    id="contact"
    class="bg-neutral-900/80 border border-neutral-800/80 p-8 md:p-14 shadow-2xl backdrop-blur-xl relative overflow-hidden"
  >
    <!-- डेकोरेटिव कॉर्नर ग्लो -->
    <div
      class="absolute -top-24 -right-24 w-80 h-80 bg-[#FFD758]/10 rounded-full blur-3xl pointer-events-none"
    ></div>

    <div class="text-center max-w-3xl mx-auto mb-14 relative z-10">
      <span
        class="inline-block py-1.5 px-4 rounded-full bg-[#FFD758]/10 border border-[#FFD758]/30 text-[#FFD758] text-xs font-bold tracking-widest uppercase mb-4 shadow-[0_0_15px_rgba(255,215,88,0.2)]"
      >
        Get In Touch
      </span>
      <h2
        class="text-4xl md:text-6xl font-black text-white mb-4 tracking-tight"
      >
        Let's Build Something
        <span
          class="text-transparent bg-clip-text bg-gradient-to-r from-[#FFD758] to-amber-400"
          >Extraordinary</span
        >
      </h2>
      <p
        class="text-neutral-400 text-sm md:text-base font-light leading-relaxed"
      >
        Got a visionary project, an idea, or an opportunity in mind? Let’s talk!
        Drop a message below or connect instantly through our channels.
      </p>
    </div>

    <div
      class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center relative z-10"
    >
      <!-- ✍️ Contact Form (Connected via Web3Forms) -->
      <!-- ✍️ Contact Form (Web3Forms Connected) -->
      <form (ngSubmit)="onSubmit()" class="space-y-5 text-left">
        <div>
          <label
            for="name"
            class="block mb-2 text-xs font-semibold tracking-wider text-neutral-300 uppercase"
            >Your Name</label
          >
          <input
            id="name"
            type="text"
            [(ngModel)]="formData.name"
            name="name"
            required
            placeholder="Raviraj Choudhary"
            class="w-full px-4 py-3.5 bg-neutral-950/80 border border-neutral-800 rounded-2xl text-white placeholder-neutral-600 focus:outline-none focus:border-[#FFD758] focus:ring-2 focus:ring-[#FFD758]/20 transition-all duration-300"
          />
        </div>

        <div>
          <label
            for="email"
            class="block mb-2 text-xs font-semibold tracking-wider text-neutral-300 uppercase"
            >Email Address</label
          >
          <input
            id="email"
            type="email"
            [(ngModel)]="formData.email"
            name="email"
            required
            placeholder="example123@gmail.com"
            class="w-full px-4 py-3.5 bg-neutral-950/80 border border-neutral-800 rounded-2xl text-white placeholder-neutral-600 focus:outline-none focus:border-[#FFD758] focus:ring-2 focus:ring-[#FFD758]/20 transition-all duration-300"
          />
        </div>

        <div>
          <label
            for="message"
            class="block mb-2 text-xs font-semibold tracking-wider text-neutral-300 uppercase"
            >Your Message</label
          >
          <textarea
            id="message"
            rows="4"
            [(ngModel)]="formData.message"
            name="message"
            required
            placeholder="Write your project details here..."
            class="w-full px-4 py-3.5 bg-neutral-950/80 border border-neutral-800 rounded-2xl text-white placeholder-neutral-600 focus:outline-none focus:border-[#FFD758] focus:ring-2 focus:ring-[#FFD758]/20 transition-all duration-300 resize-none"
          ></textarea>
        </div>

        <!-- Success Message Alert -->
        <div
          *ngIf="successMessage"
          class="p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-sm font-medium"
        >
          {{ successMessage }}
        </div>

        <!-- Error Message Alert -->
        <div
          *ngIf="errorMessage"
          class="p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm font-medium"
        >
          {{ errorMessage }}
        </div>

        <button
          type="submit"
          [disabled]="isSubmitting"
          class="w-full py-4 bg-gradient-to-r from-[#FFD758] to-amber-400 text-neutral-950 font-extrabold rounded-2xl hover:from-white hover:to-neutral-200 transition-all duration-300 shadow-[0_0_25px_rgba(255,215,88,0.3)] cursor-pointer text-base tracking-wide disabled:opacity-50"
        >
          <span *ngIf="!isSubmitting">Send Message</span>
          <span *ngIf="isSubmitting">Sending...</span>
        </button>
      </form>
      <div class="flex justify-center">
        <div
          class="relative w-full max-w-md h-[400px] flex items-center justify-center"
        >
          <!-- 👩‍🎨 Central Girl & Laptop Image -->
          <img
            src="assets/Images/contact-us.webp"
            alt="Contact Illustration"
            class="w-full h-full object-contain z-10"
          />

          <!-- 📞 1. Big Phone Bubble (Top-Left Exact Match) -->
          <div
            class="absolute top-[10%] left-[2%] w-24 h-24 bg-neutral-950 border-2 border-white/90 rounded-full flex items-center justify-center shadow-2xl z-20 animate-float-2"
          >
            <svg
              class="w-10 h-10 text-white"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
              ></path>
            </svg>
          </div>

          <!-- ❓ 2. Question Mark (Above girl's head, slightly left) -->
          <div
            class="absolute top-[14%] left-[38%] w-9 h-9 bg-neutral-950 border-2 border-white/90 rounded-full flex items-center justify-center shadow-xl z-20 animate-float-1 text-white font-bold text-base"
          >
            ?
          </div>

          <!-- 💬 3. Chat Bubble (Fixed Shape & Size) -->
          <div
            class="absolute top-[6%] right-[16%] p-3 flex items-center justify-center z-20 animate-float-3"
          >
            <svg
              class="w-10 h-10 text-white drop-shadow-lg"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
              ></path>
            </svg>
          </div>

          <!-- ⏰ 4. Clock Icon (Size Increased, Transparent) -->
          <div
            class="absolute top-[24%] right-[20%] p-3 flex items-center justify-center z-20 animate-float-2"
          >
            <svg
              class="w-9 h-9 text-white drop-shadow-lg"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
              ></path>
            </svg>
          </div>

          <!-- ✉️ 5. Envelope Icon (Size Increased, Transparent) -->
          <div
            class="absolute top-[36%] right-[4%] p-3 flex items-center justify-center z-20 animate-float-1"
          >
            <svg
              class="w-10 h-10 text-white drop-shadow-lg"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
              ></path>
            </svg>
          </div>

          <!-- ⚙️ 6. Gear / Setting Icon (Bottom-Left, near laptop base) -->
          <div
            class="absolute bottom-[30%] left-[14%] p-2 bg-neutral-950 border-2 border-white/90 rounded-full flex items-center justify-center shadow-xl z-25 animate-float-3"
          >
            <svg
              class="w-5 h-5 text-white"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
              ></path>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </section>
