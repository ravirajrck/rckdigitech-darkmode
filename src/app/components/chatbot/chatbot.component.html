<!-- 🤖 Floating Chatbot Toggle Button -->
<button 
  (click)="toggleChat()" 
  class="fixed bottom-6 right-6 z-[99999] pointer-events-auto w-14 h-14 rounded-full bg-[#FFD758] text-neutral-950 flex items-center justify-center shadow-[0_0_20px_rgba(255,215,88,0.5)] hover:scale-110 transition-transform duration-300 cursor-pointer"
>
  <svg *ngIf="!isOpen" class="w-7 h-7 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
  </svg>
  <svg *ngIf="isOpen" class="w-6 h-6 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
  </svg>
</button>

<!-- 💬 Chat Window Popup -->
<div *ngIf="isOpen" class="fixed bottom-24 right-6 z-[99999] pointer-events-auto w-80 sm:w-96 bg-neutral-950 border border-neutral-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col">
  
  <!-- Chat Header -->
  <div class="bg-neutral-900 px-4 py-3 border-b border-neutral-800 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <span class="text-sm font-bold text-white">RCK Digitex AI Assistant</span>
    </div>
    <!-- Close Button with explicit cursor-pointer -->
    <button (click)="toggleChat()" class="text-neutral-400 hover:text-white cursor-pointer p-1">
      <svg class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Messages Body -->
  <div class="p-4 h-72 overflow-y-auto space-y-3 text-sm text-neutral-300 flex flex-col cursor-default">
    <div class="bg-neutral-900 p-3 rounded-xl max-w-[85%] self-start border border-neutral-800">
      Hello! 👋 Welcome to RCK Digitex. How can I help you with our tech services today?
    </div>
    <div *ngFor="let msg of messages" [ngClass]="msg.sender === 'user' ? 'self-end bg-[#FFD758] text-neutral-950 font-medium' : 'self-start bg-neutral-900 border border-neutral-800 text-neutral-300'" class="p-3 rounded-xl max-w-[85%]">
      {{ msg.text }}
    </div>
  </div>

  <!-- Chat Input Footer -->
  <div class="p-3 bg-neutral-900 border-t border-neutral-800 flex items-center gap-2">
    <!-- Input box with cursor-text -->
    <input 
      [(ngModel)]="userMessage" 
      (keyup.enter)="sendMessage()" 
      type="text" 
      placeholder="Type a message..." 
      class="flex-1 bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-[#FFD758] cursor-text"
    />
    <!-- Send Button with cursor-pointer -->
    <button (click)="sendMessage()" class="bg-[#FFD758] text-neutral-950 p-2 rounded-lg hover:bg-amber-400 transition cursor-pointer">
      <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"></path>
      </svg>
    </button>
  </div>

</div>
