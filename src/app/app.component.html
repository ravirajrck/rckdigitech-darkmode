<!-- Custom Animated Cursor Elements -->
<div id="custom-cursor" class="fixed pointer-events-none z-[99999] w-4 h-4 rounded-full bg-[#FFD758]/80 -translate-x-1/2 -translate-y-1/2 transition-transform duration-75 ease-out hidden md:block"></div>
<div id="cursor-follower" class="fixed pointer-events-none z-[99998] w-8 h-8 rounded-full border border-[#FFD758]/50 -translate-x-1/2 -translate-y-1/2 transition-transform duration-150 ease-out hidden md:block"></div>

<!-- Header -->
<app-header></app-header>

<!-- Main Page Content -->
<router-outlet></router-outlet>

<!-- Footer -->
<app-footer></app-footer>

<!-- 🚀 Scroll to Top Button (Appears on scrolling down) -->
<button 
  *ngIf="showScrollTop" 
  (click)="scrollToTop()"
  class="fixed bottom-24 right-6 sm:bottom-6 sm:right-24 z-[9998] w-12 h-12 rounded-full bg-neutral-900 border border-[#FFD758]/50 text-[#FFD758] flex items-center justify-center shadow-[0_0_15px_rgba(255,215,88,0.2)] hover:bg-[#FFD758] hover:text-neutral-950 transition-all duration-300 cursor-pointer"
  title="Scroll to top"
>
  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"></path>
  </svg>
</button>

<!-- 🤖 Floating AI Chatbot Widget -->
<app-chatbot></app-chatbot>
